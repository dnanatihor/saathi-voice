[project]
name = "saathi-voice"
version = "0.1.0"
description = "Hindi voice assistant for elders: medication reminders and daily check-ins."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "sqlmodel>=0.0.22",
]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pre-commit>=4",
    "pytest>=8",
    "ruff==0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saathi"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["saathi"]
warn_unused_ignores = true
